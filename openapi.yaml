components:
  schemas:
    AddMonitHistoryCommand:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MonitHistoryDto'
          nullable: true
      additionalProperties: false
    AddParticipantCommand:
      type: object
      properties:
        name:
          type: string
          nullable: true
        bicNo:
          type: string
          nullable: true
        userId:
          type: integer
          format: int32
        email:
          type: string
          nullable: true
      additionalProperties: false
    AddParticipantThresholdCommand:
      type: object
      properties:
        bic:
          type: string
          nullable: true
        goldenAmount:
          type: number
          format: double
        amberPercentage:
          type: number
          format: double
        redPercentage:
          type: number
          format: double
        alertRecipients:
          type: string
          nullable: true
        enforceSendRestriction:
          type: boolean
        minimumSendBalance:
          type: number
          format: double
      additionalProperties: false
    AddRoleCommand:
      type: object
      properties:
        name:
          type: string
          nullable: true
        claims:
          type: array
          items:
            type: string
          nullable: true
      additionalProperties: false
    AddUserCommand:
      type: object
      properties:
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        password:
          type: string
          nullable: true
        roles:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
      additionalProperties: false
    BalanceWebhookDto:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        total_count:
          type: integer
          format: int32
        participants:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantBalanceDto'
          nullable: true
      additionalProperties: false
    BicInteractionDto:
      type: object
      properties:
        bic:
          type: string
          nullable: true
        transactionCount:
          type: integer
          format: int64
        totalAmount:
          type: number
          format: double
      additionalProperties: false
    BicStatisticsDto:
      type: object
      properties:
        netSettlementHeaderId:
          type: integer
          format: int64
        date:
          type: string
          format: date-time
        bic:
          type: string
          nullable: true
        sentCount:
          type: integer
          format: int64
        totalAmountSent:
          type: number
          format: double
        receivedCount:
          type: integer
          format: int64
        totalAmountReceived:
          type: number
          format: double
        totalFeesReceived:
          type: number
          format: double
        topReceivers:
          type: array
          items:
            $ref: '#/components/schemas/BicInteractionDto'
          nullable: true
        topSenders:
          type: array
          items:
            $ref: '#/components/schemas/BicInteractionDto'
          nullable: true
      additionalProperties: false
    BicStatisticsDtoListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BicStatisticsDto'
          nullable: true
        isSuccess:
          type: boolean
        statusCode:
          type: integer
          format: int32
        message:
          type: string
          nullable: true
        cacheInMins:
          type: integer
          format: int32
      additionalProperties: false
    BoardDashboardCardDto:
      type: object
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
          nullable: true
        value:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
      additionalProperties: false
    BoardDashboardCardsResponseDto:
      type: object
      properties:
        data:
          type: array
          items:
